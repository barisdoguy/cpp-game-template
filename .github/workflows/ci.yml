name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: >-
    ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
    libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev
    wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux GCC, os: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { name: Linux Clang, os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { name: Windows MSVC, os: windows-2022 }
          - { name: macOS Clang, os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAME_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Headless smoke run
        if: runner.os == 'Linux'
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ./build/game --frames 600 --screenshot screenshot-${{ matrix.cc }}.png

      - name: Upload screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.cc }}
          path: screenshot-${{ matrix.cc }}.png

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - name: Configure
        run: cmake --preset asan -DGAME_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset asan
      - name: Unit tests
        run: ctest --preset asan
      - name: Headless smoke run
        env:
          SDL_VIDEO_DRIVER: dummy
        run: ./build/asan/game --frames 120

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          clang-format --version
          find src tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror
